[package]
name = "viberar"
version = "1.0.0"
description = "VibeRAR - High Performance Archive Manager"
authors = ["VibeRAR Team"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
chrono = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "time"] }
log = "0.4"
crc32fast = "1.4"
